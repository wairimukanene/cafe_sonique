services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cafe_sonique
      POSTGRES_USER: sonique
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonique_dev}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - sonique_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonique -d cafe_sonique"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sonique_postgres:
