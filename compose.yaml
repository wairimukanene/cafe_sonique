services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cafe_sonique
      POSTGRES_USER: sonique
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonique_dev}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - sonique_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonique -d cafe_sonique"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://sonique:${POSTGRES_PASSWORD:-sonique_dev}@postgres:5432/cafe_sonique
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - sonique_media:/app/.data/media
      - sonique_receipts:/app/.data/receipts
    depends_on:
      postgres:
        condition: service_healthy

  # One-off jobs: docker compose run --rm tools npm run db:migrate
  tools:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://sonique:${POSTGRES_PASSWORD:-sonique_dev}@postgres:5432/cafe_sonique
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sonique_postgres:
  sonique_media:
  sonique_receipts:
